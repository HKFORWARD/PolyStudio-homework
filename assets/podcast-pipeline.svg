<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1480" viewBox="0 0 1100 1480" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: bold; fill: #0f172a; }
      .phase { font-size: 16px; font-weight: bold; fill: #334155; }
      .box-title { font-size: 17px; font-weight: bold; }
      .box-detail { font-size: 13px; fill: #475569; }
      .code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #1e40af; }
      .ts { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #6b7280; }
      .annotation { font-size: 12px; font-style: italic; fill: #b45309; }
      .data-label { font-size: 12px; fill: #1e40af; font-style: italic; }
      .conclusion { font-size: 13px; fill: #166534; font-weight: bold; }
    </style>
  </defs>

  <!-- 标题 -->
  <text x="550" y="40" text-anchor="middle" class="title">视频 → 智能播客 多模态二创流水线</text>
  <text x="550" y="65" text-anchor="middle" class="box-detail">PolyStudio · Test 4 实测调用链（2026-04-27 21:45-21:57）</text>

  <!-- ========== Step 0: 输入 ========== -->
  <rect x="370" y="95" width="360" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="550" y="120" text-anchor="middle" class="box-title" fill="#374151">用户上传视频</text>
  <text x="550" y="140" text-anchor="middle" class="code">video.mp4 (10.6 MB)</text>

  <line x1="550" y1="160" x2="550" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="180" class="data-label">media_path: str, question: str</text>

  <!-- ========== Step 1: qwen_omni_understand ========== -->
  <rect x="280" y="200" width="540" height="100" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="550" y="225" text-anchor="middle" class="box-title" fill="#1e3a8a">① qwen_omni_understand_tool</text>
  <text x="550" y="246" text-anchor="middle" class="ts">21:29:53 (Test 3) · text_len=745 · 同时输出 omni_xxx.wav</text>
  <text x="550" y="265" text-anchor="middle" class="box-detail">Qwen3-Omni 多模态理解：图片/音频/视频通吃</text>
  <text x="550" y="285" text-anchor="middle" class="annotation">⚠ 硬约束：视频 base64 后 ≤ 28 MB；32.7 MB 撞墙 → 三次 400 错误</text>

  <line x1="550" y1="305" x2="550" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="330" class="data-label">JSON 字符串（含 text_response 字段）</text>

  <!-- ========== Step 2: LLM 写脚本（不是工具，是 LLM 内部能力） ========== -->
  <rect x="280" y="350" width="540" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="550" y="375" text-anchor="middle" class="box-title" fill="#92400e">② LLM 写对话脚本（不是工具调用）</text>
  <text x="550" y="395" text-anchor="middle" class="box-detail">LLM 读完 ToolMessage 里的 text_response，自主拆解为多角色对话</text>
  <text x="550" y="415" text-anchor="middle" class="annotation">没有专门的"脚本生成"工具——LLM 在 messages 黑板上直接产出</text>

  <line x1="550" y1="435" x2="550" y2="475" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="460" class="data-label">对话脚本（text，分主持人/嘉宾段落）</text>

  <!-- ========== Step 3: qwen_voice_design × 2 ========== -->
  <rect x="280" y="480" width="540" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="505" text-anchor="middle" class="box-title" fill="#14532d">③ qwen_voice_design × 2</text>
  <text x="550" y="525" text-anchor="middle" class="ts">21:48:02 主持人音色 · 21:50:25 嘉宾音色</text>
  <text x="550" y="545" text-anchor="middle" class="box-detail">用文字描述生成 reference 音色样本 .wav</text>
  <text x="550" y="562" text-anchor="middle" class="annotation">为什么 ×2：LLM 看到脚本是双人对谈，自己决定造两个音色</text>

  <line x1="550" y1="572" x2="550" y2="612" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="597" class="data-label">reference_audio: 两段音色样本路径</text>

  <!-- ========== Step 4: qwen_voice_cloning × N ========== -->
  <rect x="280" y="617" width="540" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="642" text-anchor="middle" class="box-title" fill="#14532d">④ qwen_voice_cloning × N</text>
  <text x="550" y="662" text-anchor="middle" class="ts">21:51:58 段1 · 21:53:04 段2 · 21:53:32+ 段3..N</text>
  <text x="550" y="681" text-anchor="middle" class="box-detail">每段对话用对应角色的音色样本克隆出语音 .wav</text>
  <text x="550" y="701" text-anchor="middle" class="annotation">N 由 LLM 拆段决定，SKILL.md 没硬编码——这是 Task 1.A3 实证</text>

  <line x1="550" y1="717" x2="550" y2="757" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="742" class="data-label">N 段语音 .wav 文件路径</text>

  <!-- ========== Step 5: concatenate_audio ========== -->
  <rect x="280" y="762" width="540" height="80" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="550" y="787" text-anchor="middle" class="box-title" fill="#5b21b6">⑤ concatenate_audio</text>
  <text x="550" y="807" text-anchor="middle" class="ts">21:56:30 · 拼接 N 段 wav，段间留 1.2s 静音</text>
  <text x="550" y="827" text-anchor="middle" class="box-detail">基于 pydub，输出完整对话 .wav</text>

  <line x1="550" y1="842" x2="550" y2="882" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="867" class="data-label">拼接后的对话 .wav</text>

  <!-- ========== Step 6: select_bgm + mix ========== -->
  <rect x="280" y="887" width="540" height="100" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="550" y="912" text-anchor="middle" class="box-title" fill="#5b21b6">⑥ select_background_music + mix_audio_with_bgm</text>
  <text x="550" y="932" text-anchor="middle" class="ts">21:56:39 智能匹配 BGM · 21:56:51 混音</text>
  <text x="550" y="952" text-anchor="middle" class="box-detail">按主题从 storage/bgm/ 选 BGM</text>
  <text x="550" y="972" text-anchor="middle" class="box-detail">BGM 开场原声 3 秒，之后渐弱到 5% 背景音量</text>

  <line x1="550" y1="987" x2="550" y2="1027" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="1012" class="data-label">成品 .mp3</text>

  <!-- ========== Step 7: 输出 ========== -->
  <rect x="370" y="1032" width="360" height="65" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="1058" text-anchor="middle" class="box-title" fill="#92400e">🎉 成品智能播客</text>
  <text x="550" y="1078" text-anchor="middle" class="code">podcast_xxx.mp3 · 双人对谈 + BGM</text>

  <!-- ========== 底部黑板：messages 列表生长示意 ========== -->
  <rect x="40" y="1130" width="1020" height="320" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="60" y="1158" class="phase" fill="#9a3412">B2 实证：messages 列表是 Agent 的共享黑板</text>

  <text x="550" y="1185" text-anchor="middle" class="box-detail">所有工具间的"数据传递"都是 ToolMessage 追加到 messages 列表，下一轮 LLM 看完整列表后自主决策——没有任何 side channel</text>

  <!-- messages 长度增长曲线 -->
  <line x1="100" y1="1380" x2="1000" y2="1380" stroke="#9a3412" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1010" y="1385" class="box-detail" fill="#9a3412">时间</text>

  <!-- 几个时刻的 messages_count 标记 -->
  <circle cx="150" cy="1380" r="5" fill="#ea580c"/>
  <text x="150" y="1370" text-anchor="middle" class="ts" fill="#9a3412">10</text>
  <text x="150" y="1405" text-anchor="middle" class="ts">21:45</text>

  <circle cx="280" cy="1380" r="5" fill="#ea580c"/>
  <text x="280" y="1370" text-anchor="middle" class="ts" fill="#9a3412">16</text>
  <text x="280" y="1405" text-anchor="middle" class="ts">21:47</text>

  <circle cx="410" cy="1380" r="5" fill="#ea580c"/>
  <text x="410" y="1370" text-anchor="middle" class="ts" fill="#9a3412">20</text>
  <text x="410" y="1405" text-anchor="middle" class="ts">21:50</text>

  <circle cx="540" cy="1380" r="5" fill="#ea580c"/>
  <text x="540" y="1370" text-anchor="middle" class="ts" fill="#9a3412">24</text>
  <text x="540" y="1405" text-anchor="middle" class="ts">21:51</text>

  <circle cx="730" cy="1380" r="5" fill="#ea580c"/>
  <text x="730" y="1370" text-anchor="middle" class="ts" fill="#9a3412">65</text>
  <text x="730" y="1405" text-anchor="middle" class="ts">22:07</text>

  <circle cx="860" cy="1380" r="5" fill="#ea580c"/>
  <text x="860" y="1370" text-anchor="middle" class="ts" fill="#9a3412">67</text>
  <text x="860" y="1405" text-anchor="middle" class="ts">22:08</text>

  <circle cx="950" cy="1380" r="5" fill="#ea580c"/>
  <text x="950" y="1370" text-anchor="middle" class="ts" fill="#9a3412">69</text>
  <text x="950" y="1405" text-anchor="middle" class="ts">22:11</text>

  <text x="60" y="1340" class="box-detail" fill="#9a3412">messages_count（同一对话内）</text>
  <text x="60" y="1430" class="conclusion" fill="#9a3412">→ 单调递增。每多 1 次工具调用 = +2（AIMessage 带 tool_call + ToolMessage 带 result）</text>

</svg>
