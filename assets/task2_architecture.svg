<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1240" height="780" fill="#fafbfc"/>

  <!-- Title -->
  <text x="620" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Task 2 · 多角色一致性架构</text>
  <text x="620" y="64" text-anchor="middle" font-size="13" fill="#888">σ 现状基线 → β 主角锚定 → α 多图直传（升级位）</text>

  <!-- ===== Section 1: 分镜输入 ===== -->
  <rect x="60" y="90" width="1120" height="130" rx="14" ry="14" fill="#fff8e1" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="0" filter="url(#shadow2)"/>
  <text x="80" y="115" font-size="14" font-weight="700" fill="#7a5b00">📝 分镜输入（Prompt 改造后）</text>

  <text x="80" y="145" font-size="13" fill="#5a4500" font-family="monospace">角色表：</text>
  <text x="100" y="163" font-size="12" fill="#5a4500" font-family="monospace">- 小明：20岁男生，黑色短发，蓝色卫衣</text>
  <text x="100" y="180" font-size="12" fill="#5a4500" font-family="monospace">- 小红：22岁女生，长发，白色连衣裙</text>

  <text x="500" y="145" font-size="13" fill="#5a4500" font-family="monospace">镜头1（5秒）<tspan fill="#cc6600" font-weight="700">[出场: 小明]</tspan>：咖啡馆窗边看书</text>
  <text x="500" y="163" font-size="13" fill="#5a4500" font-family="monospace">镜头2（5秒）<tspan fill="#cc6600" font-weight="700">[出场: 小明, 小红]</tspan>：两人目光相遇</text>
  <text x="500" y="180" font-size="13" fill="#5a4500" font-family="monospace">镜头3（5秒）<tspan fill="#cc6600" font-weight="700">[出场: 无]</tspan>：窗外雨景空镜</text>

  <text x="80" y="206" font-size="11" fill="#996600" font-style="italic">↑ <tspan font-weight="700">[出场: ...]</tspan> 为机器友好的强约束标签，LLM 正则解析即可还原"本镜头出场角色"</text>

  <!-- Arrow down to routing -->
  <line x1="620" y1="220" x2="620" y2="260" stroke="#555" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="640" y="246" font-size="12" fill="#555" font-style="italic">parse_actors()</text>

  <!-- ===== Section 2: 选图引擎 (Routing) ===== -->
  <rect x="60" y="270" width="1120" height="270" rx="14" ry="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow2)"/>
  <text x="80" y="294" font-size="14" font-weight="700" fill="#1e40af">🎯 选图引擎（核心三叉判断）</text>

  <!-- Decision diamond -->
  <polygon points="620,310 720,360 620,410 520,360" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="620" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">出场角色数？</text>
  <text x="620" y="375" text-anchor="middle" font-size="11" fill="#1e40af">len(actors)</text>

  <!-- Branch labels -->
  <text x="280" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#555">= 0（空镜）</text>
  <text x="620" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#555">= 1（单角色）</text>
  <text x="960" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#555">≥ 2（多角色同框）</text>

  <!-- Branch arrows -->
  <line x1="520" y1="360" x2="380" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="620" y1="410" x2="620" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="720" y1="360" x2="860" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Branch 0: generate -->
  <rect x="100" y="340" width="280" height="65" rx="10" ry="10" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="240" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#155724" font-family="monospace">generate_volcano_image</text>
  <text x="240" y="383" text-anchor="middle" font-size="11" fill="#155724">prompt = 镜头描述</text>
  <text x="240" y="398" text-anchor="middle" font-size="11" fill="#155724">无参考图</text>

  <!-- Branch 1: edit single -->
  <rect x="450" y="455" width="340" height="75" rx="10" ry="10" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="620" y="478" text-anchor="middle" font-size="13" font-weight="700" fill="#155724" font-family="monospace">edit_volcano_image</text>
  <text x="620" y="498" text-anchor="middle" font-size="11" fill="#155724">image_url = canvas.get_character(A).image_url</text>
  <text x="620" y="515" text-anchor="middle" font-size="11" fill="#155724">⚠️ 首次出场则先 generate + register</text>

  <!-- Branch 2+: multi-character -->
  <rect x="860" y="340" width="300" height="105" rx="10" ry="10" fill="#fff3cd" stroke="#d4a017" stroke-width="2"/>
  <text x="1010" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5b00">β 默认（兜底）</text>
  <text x="1010" y="380" text-anchor="middle" font-size="11" fill="#7a5b00" font-family="monospace">edit(主角图, prompt+B描述)</text>
  <line x1="880" y1="392" x2="1140" y2="392" stroke="#d4a017" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1010" y="409" text-anchor="middle" font-size="12" font-weight="700" fill="#cc6600">⭐ α 升级</text>
  <text x="1010" y="427" text-anchor="middle" font-size="11" fill="#cc6600" font-family="monospace">edit(image_urls=[A,B,...])</text>
  <text x="1010" y="441" text-anchor="middle" font-size="10" fill="#a85500" font-style="italic">需改 Schema + 实测 API</text>

  <!-- ===== Section 3: 数据层 + 工具层 ===== -->
  <line x1="620" y1="540" x2="620" y2="580" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowSoft)"/>
  <text x="640" y="566" font-size="11" fill="#888" font-style="italic">读 / 写</text>

  <!-- Left: 数据层 -->
  <rect x="60" y="590" width="540" height="170" rx="14" ry="14" fill="#e7f1ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow2)"/>
  <text x="80" y="614" font-size="14" font-weight="700" fill="#1e40af">💾 数据层（持久化）</text>

  <text x="80" y="638" font-size="13" font-weight="700" fill="#1e40af" font-family="monospace">Canvas（绑项目级）</text>

  <rect x="80" y="650" width="500" height="100" rx="8" ry="8" fill="#ffffff" stroke="#a8c5f0" stroke-width="1"/>
  <text x="92" y="670" font-size="12" fill="#1a1a1a" font-family="monospace">{</text>
  <text x="105" y="687" font-size="12" fill="#1a1a1a" font-family="monospace">  id, name, createdAt, images, data,</text>
  <text x="105" y="704" font-size="12" fill="#cc3333" font-weight="700" font-family="monospace">  characters: List[Character]  ← 新增</text>
  <text x="125" y="721" font-size="11" fill="#666" font-family="monospace">// Character { id, name, image_url, description }</text>
  <text x="92" y="741" font-size="12" fill="#1a1a1a" font-family="monospace">}</text>

  <!-- Right: 工具层 -->
  <rect x="640" y="590" width="540" height="170" rx="14" ry="14" fill="#d4edda" stroke="#28a745" stroke-width="2" filter="url(#shadow2)"/>
  <text x="660" y="614" font-size="14" font-weight="700" fill="#155724">🛠️ 工具层（5 个工具）</text>

  <!-- New tools -->
  <rect x="660" y="630" width="240" height="55" rx="8" ry="8" fill="#ffffff" stroke="#28a745" stroke-width="1.5"/>
  <text x="780" y="652" text-anchor="middle" font-size="13" font-weight="700" fill="#cc3333">🆕 register_character</text>
  <text x="780" y="670" text-anchor="middle" font-size="10" fill="#666">name, description, image_url=None</text>

  <rect x="920" y="630" width="240" height="55" rx="8" ry="8" fill="#ffffff" stroke="#28a745" stroke-width="1.5"/>
  <text x="1040" y="652" text-anchor="middle" font-size="13" font-weight="700" fill="#cc3333">🆕 list_characters</text>
  <text x="1040" y="670" text-anchor="middle" font-size="10" fill="#666">→ 当前项目角色表</text>

  <!-- Existing tools -->
  <rect x="660" y="697" width="155" height="50" rx="8" ry="8" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="737" y="718" text-anchor="middle" font-size="12" font-weight="700" fill="#155724" font-family="monospace">generate</text>
  <text x="737" y="734" text-anchor="middle" font-size="10" fill="#666">_volcano_image</text>

  <rect x="830" y="697" width="155" height="50" rx="8" ry="8" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="907" y="713" text-anchor="middle" font-size="12" font-weight="700" fill="#155724" font-family="monospace">edit</text>
  <text x="907" y="729" text-anchor="middle" font-size="10" fill="#666">_volcano_image</text>
  <text x="907" y="743" text-anchor="middle" font-size="9" fill="#cc6600">α: 加多图支持</text>

  <rect x="1000" y="697" width="155" height="50" rx="8" ry="8" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="1077" y="718" text-anchor="middle" font-size="12" font-weight="700" fill="#155724" font-family="monospace">video / concat</text>
  <text x="1077" y="734" text-anchor="middle" font-size="10" fill="#666">（不动）</text>

  <!-- Connection between data and tool layer -->
  <path d="M 600 685 L 640 685" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="600" y1="685" x2="640" y2="685" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSoft)" marker-start="url(#arrowSoft)"/>
</svg>
