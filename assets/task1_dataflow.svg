<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1240" height="620" fill="#fafbfc"/>

  <!-- Title -->
  <text x="620" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">PolyStudio 长视频生成 · 数据流图</text>
  <text x="620" y="68" text-anchor="middle" font-size="13" fill="#888">用户输入 → 6 步流水线 → 成片</text>

  <!-- ===================== Row 1 (top, left → right) ===================== -->
  <!-- Node 1: 用户输入 (oval) -->
  <ellipse cx="120" cy="170" rx="70" ry="42" fill="#e7f1ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="166" text-anchor="middle" font-size="22">👤</text>
  <text x="120" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">用户输入</text>

  <!-- Node 2: ① 需求分析 (gray, prompt-only) -->
  <rect x="270" y="125" width="200" height="90" rx="14" ry="14" fill="#f0f0f0" stroke="#9aa0a6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#333">① 需求分析</text>
  <text x="370" y="183" text-anchor="middle" font-size="12" fill="#666">纯 Prompt</text>
  <text x="370" y="201" text-anchor="middle" font-size="11" fill="#999">无工具调用</text>

  <!-- Node 3: ② 分镜生成 (YELLOW = bottleneck) -->
  <rect x="540" y="125" width="200" height="90" rx="14" ry="14" fill="#fff3cd" stroke="#d4a017" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="155" text-anchor="middle" font-size="15" font-weight="700" fill="#7a5b00">② 分镜生成</text>
  <text x="640" y="178" text-anchor="middle" font-size="12" fill="#7a5b00">📝 自然语言文本</text>
  <text x="640" y="197" text-anchor="middle" font-size="11" fill="#996600">镜头N（X秒）：[描述]</text>

  <!-- Node 4: ③ generate_volcano_image (GREEN = tool) -->
  <rect x="810" y="125" width="220" height="90" rx="14" ry="14" fill="#d4edda" stroke="#28a745" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="#155724">③ 生成图片序列</text>
  <text x="920" y="175" text-anchor="middle" font-size="12" fill="#155724" font-family="monospace">generate_volcano_image</text>
  <text x="920" y="195" text-anchor="middle" font-size="11" fill="#1e7d34">🎨 每镜头独立生图</text>

  <!-- Down-bend connector from ③ to ④ -->
  <path d="M 1130 170 Q 1190 170 1190 310 Q 1190 450 1130 450" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>

  <!-- ===================== Row 2 (bottom, right → left) ===================== -->
  <!-- Node 5: ④ generate_volcano_video (GREEN = tool) -->
  <rect x="810" y="405" width="220" height="90" rx="14" ry="14" fill="#d4edda" stroke="#28a745" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#155724">④ 生成视频片段</text>
  <text x="920" y="455" text-anchor="middle" font-size="12" fill="#155724" font-family="monospace">generate_volcano_video</text>
  <text x="920" y="475" text-anchor="middle" font-size="11" fill="#1e7d34">🎬 mode=image · duration 手填</text>

  <!-- Node 6: ⑤ concatenate_videos (RED = blackhole) -->
  <rect x="540" y="405" width="200" height="90" rx="14" ry="14" fill="#ffd6d6" stroke="#cc3333" stroke-width="2" filter="url(#shadow)"/>
  <text x="640" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#8a1f1f">⑤ 拼接成片</text>
  <text x="640" y="455" text-anchor="middle" font-size="12" fill="#8a1f1f" font-family="monospace">concatenate_videos</text>
  <text x="640" y="475" text-anchor="middle" font-size="11" fill="#a82828">⚠️ 不返回实际时长</text>

  <!-- Node 7: ⑥ 质量检查 (gray, prompt-only) -->
  <rect x="270" y="405" width="200" height="90" rx="14" ry="14" fill="#f0f0f0" stroke="#9aa0a6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="438" text-anchor="middle" font-size="15" font-weight="700" fill="#333">⑥ 质量检查</text>
  <text x="370" y="463" text-anchor="middle" font-size="12" fill="#666">纯 Prompt</text>
  <text x="370" y="481" text-anchor="middle" font-size="11" fill="#999">无结构化反馈循环</text>

  <!-- Node 8: 成片 (oval) -->
  <ellipse cx="120" cy="450" rx="70" ry="42" fill="#e7f1ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="446" text-anchor="middle" font-size="22">🎞️</text>
  <text x="120" y="470" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">成片</text>

  <!-- ===================== Arrows ===================== -->
  <!-- 1 → 2 (solid) -->
  <line x1="190" y1="170" x2="262" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 → 3 (dashed, "LLM 自解析") -->
  <line x1="470" y1="170" x2="532" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 → 4 (dashed, with label "LLM 自解析 镜头/时长") -->
  <line x1="740" y1="170" x2="802" y2="170" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
  <text x="771" y="155" text-anchor="middle" font-size="10" fill="#996600" font-style="italic">LLM 自解析</text>

  <!-- 4 → 5 (dashed, label "image_url 经对话历史") in Row 2 going LEFT -->
  <line x1="810" y1="450" x2="748" y2="450" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
  <text x="779" y="435" text-anchor="middle" font-size="10" fill="#666" font-style="italic">video_urls</text>

  <!-- 5 → 6 (solid) -->
  <line x1="540" y1="450" x2="478" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 → 7 (solid) -->
  <line x1="270" y1="450" x2="198" y2="450" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edge labels for top middle "image_url 经对话历史" between row1-row2 (the down-bend) -->
  <text x="1200" y="305" text-anchor="middle" font-size="11" fill="#666" font-style="italic">image_url</text>
  <text x="1200" y="320" text-anchor="middle" font-size="11" fill="#666" font-style="italic">经对话历史</text>

  <!-- ===================== Legend ===================== -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="1120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#333">图例</text>

    <rect x="70" y="14" width="20" height="20" rx="4" fill="#fff3cd" stroke="#d4a017"/>
    <text x="100" y="29" font-size="12" fill="#444">自然语言瓶颈（LLM 自解析）</text>

    <rect x="290" y="14" width="20" height="20" rx="4" fill="#ffd6d6" stroke="#cc3333"/>
    <text x="320" y="29" font-size="12" fill="#444">拼接黑洞（实际时长不返回）</text>

    <rect x="525" y="14" width="20" height="20" rx="4" fill="#d4edda" stroke="#28a745"/>
    <text x="555" y="29" font-size="12" fill="#444">结构化工具调用</text>

    <rect x="690" y="14" width="20" height="20" rx="4" fill="#f0f0f0" stroke="#9aa0a6"/>
    <text x="720" y="29" font-size="12" fill="#444">纯 Prompt（无工具）</text>

    <line x1="855" y1="24" x2="895" y2="24" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="905" y="29" font-size="12" fill="#444">实线 = 控制流</text>

    <line x1="1000" y1="24" x2="1040" y2="24" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
    <text x="1050" y="29" font-size="12" fill="#444">虚线 = 数据传递</text>
  </g>
</svg>
